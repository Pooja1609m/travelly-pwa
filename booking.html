<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travelly Bookings</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
    body { display:flex; min-height:100vh; background-color:#f4f4f4; transition:all 0.3s; }

    /* Sidebar */
    .sidebar { width:250px; background-color:#3498db; color:white; flex-shrink:0; display:flex; flex-direction:column; padding:20px; transition:all 0.3s; }
    .sidebar h2 { margin-bottom:30px; text-align:center; font-size:20px; }
    .sidebar a { color:white; text-decoration:none; padding:12px; display:flex; align-items:center; border-radius:5px; margin-bottom:10px; transition:0.2s; white-space:nowrap; overflow:hidden; }
    .sidebar a:hover { background-color:#2980b9; }
    .sidebar a.active { background-color:#2980b9; }
    .sidebar.collapsed a .label { display:none; }

    /* Toggle Button */
    .toggle-btn { position:absolute; top:15px; left:260px; font-size:24px; cursor:pointer; color:#3498db; transition:all 0.3s; }

    /* Main content */
    .main { flex:1; padding:30px; transition:all 0.3s; }
    .main h1 { margin-bottom:30px; color:#333; }

    /* Form */
    form { background:white; padding:20px; border-radius:10px; margin-bottom:40px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
    form label { display:block; margin-bottom:5px; font-weight:bold; }
    form input, form select { width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ccc; }
    form button { padding:10px 20px; background:#3498db; color:white; border:none; border-radius:5px; cursor:pointer; }

    /* Table */
    table { width:100%; border-collapse:collapse; background:white; border-radius:10px; overflow:hidden; }
    th, td { padding:12px; text-align:left; border-bottom:1px solid #ddd; }
    th { background-color:#3498db; color:white; }
    tr:hover { background-color:#f1f1f1; }

    /* Status badges */
    .status { padding:4px 10px; border-radius:12px; color:white; font-weight:bold; font-size:14px; }
    .confirmed { background-color:#2ecc71; }
    .pending { background-color:#f1c40f; }
    .cancelled { background-color:#e74c3c; }

    /* Responsive */
    @media screen and (max-width:768px){
        body{flex-direction:column;}
        .sidebar{width:100%; flex-direction:row; overflow-x:auto;}
        .sidebar a{margin-right:10px; margin-bottom:0;}
    }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <h2>Travelly</h2>
    <a href="dashboard.html"><span class="icon">&#128200;</span><span class="label">Dashboard</span></a>
    <a href="booking.html" class="active"><span class="icon">&#128197;</span><span class="label">Bookings</span></a>
    <a href="#"><span class="icon">&#127758;</span><span class="label">Destinations</span></a>
    <a href="#"><span class="icon">&#128101;</span><span class="label">Users</span></a>
    <a href="#"><span class="icon">&#128202;</span><span class="label">Reports</span></a>
    <a href="#"><span class="icon">&#9881;</span><span class="label">Settings</span></a>
</div>

<!-- Toggle Button -->
<div class="toggle-btn" id="toggleBtn">&#9776;</div>

<!-- Main Content -->
<div class="main">
    <h1>Bookings</h1>

    <!-- Booking Form -->
    <form id="bookingForm">
        <label for="user">User Name</label>
        <input type="text" id="user" placeholder="Enter user name" required>

        <label for="destination">Destination</label>
        <select id="destination" required>
            <option value="">Select destination</option>
            <option value="Paris">Paris</option>
            <option value="Tokyo">Tokyo</option>
            <option value="New York">New York</option>
        </select>

        <label for="date">Date</label>
        <input type="date" id="date" required>

        <label for="status">Status</label>
        <select id="status" required>
            <option value="">Select status</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Pending">Pending</option>
            <option value="Cancelled">Cancelled</option>
        </select>

        <button type="submit">Add Booking</button>
    </form>

    <!-- Booking Table -->
    <table id="bookingTable">
        <thead><tr><th>User</th><th>Destination</th><th>Date</th><th>Status</th></tr></thead>
        <tbody>
            <tr><td>Alice</td><td>Paris</td><td>2025-10-05</td><td><span class="status confirmed">Confirmed</span></td></tr>
            <tr><td>Bob</td><td>Tokyo</td><td>2025-10-08</td><td><span class="status pending">Pending</span></td></tr>
        </tbody>
    </table>
</div>

<script>
    // Sidebar toggle
    const toggleBtn = document.getElementById('toggleBtn');
    const sidebar = document.getElementById('sidebar');
    toggleBtn.addEventListener('click', () => { sidebar.classList.toggle('collapsed'); });

    // Booking form
    const bookingForm = document.getElementById('bookingForm');
    const bookingTable = document.getElementById('bookingTable').getElementsByTagName('tbody')[0];

    bookingForm.addEventListener('submit', function(e){
        e.preventDefault();
        const user = document.getElementById('user').value;
        const dest = document.getElementById('destination').value;
        const date = document.getElementById('date').value;
        const status = document.getElementById('status').value;

        const tr = document.createElement('tr');
        const statusClass = status.toLowerCase();
        tr.innerHTML = `
            <td>${user}</td>
            <td>${dest}</td>
            <td>${date}</td>
            <td><span class="status ${statusClass}">${status}</span></td>
        `;
        bookingTable.appendChild(tr);
        bookingForm.reset();
    });
</script>

</body>
</html>
