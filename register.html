<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travelly | Register</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{
        background:linear-gradient(135deg,#6c5ce7,#0984e3);
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
    }
    .container{
        background:rgba(255,255,255,0.95);
        padding:40px 50px;
        border-radius:15px;
        box-shadow:0 8px 25px rgba(0,0,0,0.2);
        width:370px;
        text-align:center;
        animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn{
        from{opacity:0;transform:translateY(20px);}
        to{opacity:1;transform:translateY(0);}
    }
    h2{margin-bottom:20px;color:#2d3436;font-size:28px;}
    input{
        width:100%;
        padding:12px;
        margin:10px 0;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:16px;
        transition:0.3s;
    }
    input:focus{
        border-color:#6c5ce7;
        outline:none;
        box-shadow:0 0 5px #a29bfe;
    }
    button{
        width:100%;
        padding:12px;
        background:#6c5ce7;
        color:white;
        border:none;
        border-radius:8px;
        font-size:18px;
        cursor:pointer;
        transition:0.3s;
        margin-top:10px;
    }
    button:hover{
        background:#a29bfe;
    }
    p{margin-top:15px;color:#636e72;}
    a{color:#6c5ce7;text-decoration:none;font-weight:bold;}
    a:hover{text-decoration:underline;}
</style>
</head>
<body>
    <div class="container">
        <h2>Create Account ✈️</h2>
        <form action="/register" method="POST" onsubmit="return handleRegister(event)">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>

<script>
function handleRegister(e){
    e.preventDefault();
    const name=document.getElementById('name').value;
    const email=document.getElementById('email').value;
    const password=document.getElementById('password').value;
    alert(`Welcome ${name}! Registration successful.`);
    // Save user to localStorage (demo)
    const users=JSON.parse(localStorage.getItem('users'))||[];
    users.push({name,email,password});
    localStorage.setItem('users',JSON.stringify(users));
    window.location.href='login.html';
}
</script>
</body>
</html>
