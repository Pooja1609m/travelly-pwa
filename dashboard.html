<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travelly Dashboard</title>
<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
    body{display:flex;min-height:100vh;background:#f4f4f4;transition:all 0.3s;}
    .sidebar{width:250px;background:#3498db;color:white;flex-shrink:0;display:flex;flex-direction:column;padding:20px;transition:all 0.3s;}
    .sidebar.collapsed{width:70px;}
    .sidebar h2{margin-bottom:30px;text-align:center;font-size:20px;}
    .sidebar a{color:white;text-decoration:none;padding:12px;display:flex;align-items:center;border-radius:5px;margin-bottom:10px;transition:0.2s;white-space:nowrap;overflow:hidden;}
    .sidebar a:hover, .sidebar a.active{background:#2980b9;}
    .sidebar a .label{margin-left:10px;}
    .sidebar.collapsed a .label{display:none;}
    .toggle-btn{position:absolute;top:15px;left:260px;font-size:24px;cursor:pointer;color:#3498db;transition:all 0.3s;}
    .collapsed + .toggle-btn{left:80px;}
    .main{flex:1;padding:30px;transition:all 0.3s;}
    .main h1{margin-bottom:30px;color:#333;}
    .cards{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:40px;}
    .card{background:white;flex:1 1 200px;padding:20px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,0.1);display:flex;align-items:center;gap:15px;transition:transform 0.3s;}
    .card:hover{transform:scale(1.05);}
    .card .icon{font-size:40px;color:#3498db;}
    .card h3{margin-bottom:5px;}
    .card p{font-size:24px;font-weight:bold;}
    table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;}
    th,td{padding:12px;text-align:left;border-bottom:1px solid #ddd;}
    th{background:#3498db;color:white;}
    tr:hover{background:#f1f1f1;}
    .status{padding:4px 10px;border-radius:12px;color:white;font-weight:bold;font-size:14px;}
    .confirmed{background:#2ecc71;}
    .pending{background:#f1c40f;}
    .cancelled{background:#e74c3c;}
    @media screen and (max-width:768px){body{flex-direction:column;} .sidebar{width:100%;flex-direction:row;overflow-x:auto;} .sidebar a{margin-right:10px;margin-bottom:0;} .cards{flex-direction:column;} .toggle-btn{top:10px;left:10px;}}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <h2>Travelly</h2>
    <a href="dashboard.html" class="active"><span class="icon">&#128200;</span><span class="label">Dashboard</span></a>
    <a href="booking.html"><span class="icon">&#128197;</span><span class="label">Bookings</span></a>
    <a href="#"><span class="icon">&#127758;</span><span class="label">Destinations</span></a>
    <a href="#"><span class="icon">&#128101;</span><span class="label">Users</span></a>
    <a href="#"><span class="icon">&#128202;</span><span class="label">Reports</span></a>
    <a href="#"><span class="icon">&#9881;</span><span class="label">Settings</span></a>
</div>

<div class="toggle-btn" id="toggleBtn">&#9776;</div>

<div class="main">
    <h1>Dashboard</h1>

    <div class="cards">
        <div class="card"><div class="icon">&#128101;</div><div><h3>Total Users</h3><p>1245</p></div></div>
        <div class="card"><div class="icon">&#128197;</div><div><h3>Total Bookings</h3><p>0</p></div></div>
        <div class="card"><div class="icon">&#127758;</div><div><h3>Popular Destination</h3><p>N/A</p></div></div>
        <div class="card"><div class="icon">&#128181;</div><div><h3>Revenue</h3><p>$0</p></div></div>
    </div>

    <h2>Recent Bookings</h2>
    <table id="bookingTable">
        <thead><tr><th>User</th><th>Destination</th><th>Date</th><th>Status</th></tr></thead>
        <tbody></tbody>
    </table>

    <div class="chart-container">
        <h2>Monthly Bookings</h2>
        <canvas id="bookingsChart"></canvas>
    </div>
</div>

<script>
const toggleBtn = document.getElementById('toggleBtn');
const sidebar = document.getElementById('sidebar');
toggleBtn.addEventListener('click', ()=>{sidebar.classList.toggle('collapsed');});

// Load bookings from localStorage
let bookings = JSON.parse(localStorage.getItem('bookings')) || [];

// Render booking table
const bookingTable = document.getElementById('bookingTable').getElementsByTagName('tbody')[0];
function renderTable(){
    bookingTable.innerHTML='';
    bookings.forEach(b=>{
        const tr = document.createElement('tr');
        const statusClass = b.status.toLowerCase();
        tr.innerHTML=`<td>${b.user}</td><td>${b.destination}</td><td>${b.date}</td><td><span class="status ${statusClass}">${b.status}</span></td>`;
        bookingTable.appendChild(tr);
    });
}
renderTable();

// Update Dashboard Cards
document.querySelector('.cards .card:nth-child(2) p').textContent = bookings.length;
document.querySelector('.cards .card:nth-child(4) p').textContent = `$${bookings.length*100}`;

// Popular Destination
if(bookings.length===0){
    document.querySelector('.cards .card:nth-child(3) p').textContent='N/A';
}else{
    const destCount={};
    bookings.forEach(b=>{destCount[b.destination]=(destCount[b.destination]||0)+1;});
    const popularDest = Object.keys(destCount).reduce((a,b)=>destCount[a]>destCount[b]?a:b);
    document.querySelector('.cards .card:nth-child(3) p').textContent=popularDest;
}

// Chart
const ctx = document.getElementById('bookingsChart').getContext('2d');
const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthlyCounts=new Array(12).fill(0);
bookings.forEach(b=>{monthlyCounts[new Date(b.date).getMonth()]++;});

const bookingsChart = new Chart(ctx,{
    type:'bar',
    data:{labels:months,datasets:[{label:'Bookings',data:monthlyCounts,backgroundColor:'#3498db'}]},
    options:{responsive:true,plugins:{legend:{display:false}}}
});
</script>
</body>
</html>
